<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STK Policies & Guidelines</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/msal/2.38.3/msal-browser.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#f3f2f1;min-height:100vh;color:#252423}
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh}
.login-box{background:#fff;padding:40px;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.1);text-align:center;max-width:360px}
.login-box h1{font-size:1.2rem;margin-bottom:18px;color:#0f6a5e}
#btn-login{background:#0f6a5e;color:#fff;border:none;padding:11px 28px;border-radius:5px;font-size:.9rem;cursor:pointer}
#btn-login:disabled{opacity:.5;cursor:not-allowed}
#login-err{color:#a4262c;font-size:.78rem;margin-top:12px;display:none}

#app{display:none}
.banner{position:relative;height:190px;background:linear-gradient(135deg,#0f6a5e,#0a4a42);overflow:hidden}
.banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.35}
.banner-inner{position:relative;z-index:1;padding:24px 32px;height:100%;display:flex;flex-direction:column;justify-content:flex-end}
.banner-badge{display:inline-block;background:#0f6a5e;color:#fff;font-weight:700;font-size:.8rem;padding:6px 14px;border-radius:4px;letter-spacing:.5px;margin-bottom:14px;width:fit-content}
.banner-email{color:#fff;font-size:.85rem;font-weight:600;margin-bottom:8px}
.banner-user{color:#fff;font-size:.8rem;display:flex;align-items:center;gap:8px;opacity:.9}
.banner-user .dot{width:22px;height:22px;border-radius:50%;background:#fff;color:#0f6a5e;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700}

.wrap{max-width:1200px;margin:24px auto;padding:0 20px 60px}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.toolbar .cat-switch{display:flex;gap:6px}
.cat-btn{padding:7px 16px;border:1px solid #0f6a5e;background:#fff;color:#0f6a5e;border-radius:5px;font-size:.82rem;font-weight:600;cursor:pointer}
.cat-btn.active{background:#0f6a5e;color:#fff}
.cat-btn:disabled{opacity:.4;cursor:not-allowed}
.hint{font-size:.76rem;color:#605e5c}

table{width:100%;border-collapse:collapse;background:#fff;border-radius:6px;overflow:visible;box-shadow:0 1px 3px rgba(0,0,0,.08)}
thead th{background:#0f6a5e;color:#fff;text-align:left;padding:10px 14px;font-size:.8rem;font-weight:600}
tbody td{padding:9px 14px;font-size:.82rem;border-bottom:1px solid #edebe9;vertical-align:middle}
tbody tr.dept-first td.dept-cell{border-top:2px solid #d6d4d2}
td.dept-cell{background:#eef7f5;font-weight:700;color:#0f6a5e}
td.team-cell{color:#323130;font-weight:500}

.dd{position:relative}
.dd-btn{width:100%;max-width:260px;display:flex;justify-content:space-between;align-items:center;gap:8px;
  border:1px solid #d2d0ce;background:#fff;border-radius:4px;padding:6px 10px;font-size:.78rem;cursor:pointer;color:#323130}
.dd-btn:hover{border-color:#0f6a5e}
.dd-btn .arrow{color:#605e5c;font-size:.7rem}
.dd-panel{position:absolute;top:calc(100% + 4px);left:0;min-width:280px;max-width:400px;background:#fff;
  border:1px solid #d2d0ce;border-radius:5px;box-shadow:0 4px 14px rgba(0,0,0,.15);z-index:50;display:none;max-height:260px;overflow-y:auto}
.dd-panel.open{display:block}
.dd-item{padding:8px 12px;font-size:.78rem;cursor:pointer;border-bottom:1px solid #f3f2f1;display:flex;align-items:center;gap:8px;color:#252423}
.dd-item:last-child{border-bottom:none}
.dd-item:hover{background:#eef7f5}
.dd-item .fico{color:#0f6a5e;flex-shrink:0}
.dd-empty,.dd-loading,.dd-error{padding:14px 12px;font-size:.76rem;color:#605e5c;text-align:center}
.dd-error{color:#a4262c}

#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#252423;color:#fff;
  padding:10px 20px;border-radius:5px;font-size:.82rem;display:none;z-index:200;box-shadow:0 4px 12px rgba(0,0,0,.2)}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <h1>STK Policies & Guidelines</h1>
    <button id="btn-login" disabled>초기화 중...</button>
    <div id="login-err"></div>
  </div>
</div>

<div id="app">
  <div class="banner">
    <img src="https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?w=1600&q=60" alt="">
    <div class="banner-inner">
      <div class="banner-badge">STK POLICIES & GUIDELINES</div>
      <div class="banner-email">E-mail: stk_compliance@hyosung.com</div>
      <div class="banner-user"><span class="dot" id="user-initial">U</span><span id="user-name">-</span></div>
    </div>
  </div>

  <div class="wrap">
    <div class="toolbar">
      <div class="cat-switch">
        <button class="cat-btn active" data-cat="SPG" onclick="switchCategory('SPG')">SPG (Policies & Procedures / Templates)</button>
        <button class="cat-btn" data-cat="PDCF" disabled title="추후 오픈 예정">PDCF (준비중)</button>
      </div>
      <div class="hint">▼ 버튼을 클릭하면 등록된 문서 목록이 표시됩니다. 문서 클릭 시 바로 다운로드됩니다.</div>
    </div>

    <table>
      <thead>
        <tr><th style="width:14%">Department</th><th style="width:22%">Team</th><th style="width:32%">Policies & Procedures</th><th style="width:32%">Templates</th></tr>
      </thead>
      <tbody id="tbl-body"></tbody>
    </table>
  </div>
</div>

<div id="toast"></div>

<script>
// ══════════════════════════════════════════════════════════
// 설정
// ══════════════════════════════════════════════════════════
const CLIENT_ID = '432976c2-b43a-492e-8213-ece505fa1f51';
const TENANT_ID = '19cab1f5-21f4-44df-8ac6-96d6ca595203';
const GRAPH     = 'https://graph.microsoft.com/v1.0';
const SCOPES    = ['User.Read','Sites.ReadWrite.All','Files.ReadWrite.All'];

const SITE_PATH    = 'startruckkorea.sharepoint.com:/sites/STK-NAS:';
const LIBRARY_NAME = 'STK';   // 라이브러리 서버상대경로 폴더명 (표시이름: STK공유문서). 다르면 여기만 수정.
const BASE_FOLDER  = 'STK-Shared/6. STK-directed B2B/017._SPG & PDCF STK';
const SPG_ROOT     = BASE_FOLDER + '/01_SPG';
const LOG_ROOT      = BASE_FOLDER + '/00_Logging';

// 파일명 규칙: "01-STK_..." 처럼 숫자-STK_ 로 시작해야 목록에 노출됨 (정렬 기준 = 숫자)
const NAME_RULE = /^(\d+)-STK_/;

let msalApp = null, user = null, siteId = null, driveId = null;

// ══════════════════════════════════════════════════════════
// 부서/팀 구조 (STK POLICIES & GUIDELINES 표 기준)
// ══════════════════════════════════════════════════════════
const DEPTS = [
  {dept:'CEO Office', teams:['CEO Office']},
  {dept:'Compliance', teams:['Compliance','Compliance Newsletter']},
  {dept:'HR', teams:['HR']},
  {dept:'ND', teams:['ND']},
  {dept:'Legal', teams:['Legal']},
  {dept:'F&C', teams:['CFO Office','Accounting','Controlling','Purchasing','GA']},
  {dept:'ITS', teams:['Infrastructure','MPC Apps']},
  {dept:'Sales', teams:['Sales']},
  {dept:'PMM', teams:['Product Management','Marketing','Homologation']},
  {dept:'CSP', teams:['Customer Service','Parts']},
];

let currentCategory = 'SPG';

// ══════════════════════════════════════════════════════════
// MSAL 초기화 (기존 STK 시스템들과 동일 패턴)
// ══════════════════════════════════════════════════════════
window.addEventListener('load', async () => {
  const btn = document.getElementById('btn-login');
  const fallback = setTimeout(() => { if (btn.disabled) { btn.disabled = false; btn.textContent = 'Hyosung M365 계정으로 로그인'; } }, 5000);
  try {
    msalApp = new msal.PublicClientApplication({
      auth: { clientId: CLIENT_ID, authority: 'https://login.microsoftonline.com/' + TENANT_ID, redirectUri: window.location.origin + window.location.pathname },
      cache: { cacheLocation: 'localStorage', storeAuthStateInCookie: false }
    });
    await msalApp.initialize();
    clearTimeout(fallback);
    const resp = await msalApp.handleRedirectPromise();
    if (resp) { msalApp.setActiveAccount(resp.account); await boot(resp.account); return; }
    const accounts = msalApp.getAllAccounts();
    if (accounts.length) { msalApp.setActiveAccount(accounts[0]); await boot(accounts[0]); return; }
    btn.disabled = false; btn.textContent = 'Hyosung M365 계정으로 로그인';
  } catch(e) {
    clearTimeout(fallback); btn.disabled = false; btn.textContent = 'Hyosung M365 계정으로 로그인';
    console.warn('MSAL 초기화 오류:', e.message);
  }
});
document.getElementById('btn-login').onclick = async () => {
  try { await msalApp.loginRedirect({ scopes: SCOPES }); }
  catch(e) { document.getElementById('login-err').textContent = e.message; document.getElementById('login-err').style.display = 'block'; }
};

async function token() {
  const account = msalApp.getActiveAccount();
  try {
    const r = await msalApp.acquireTokenSilent({ scopes: SCOPES, account });
    return r.accessToken;
  } catch(e) {
    const r = await msalApp.acquireTokenRedirect({ scopes: SCOPES });
    return r.accessToken;
  }
}

async function api(path, method='GET', body=null, rawUrl=false) {
  const t = await token();
  const opts = { method, headers: { Authorization: 'Bearer ' + t, 'Content-Type': 'application/json', Prefer: 'HonorNonIndexedQueriesWarningMayFailRandomly' } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(rawUrl ? path : GRAPH + path, opts);
  if (!res.ok) { const t2 = await res.text(); throw new Error(res.status + ' ' + t2); }
  return res.status === 204 ? null : res.json();
}

async function boot(account) {
  user = account;
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('user-name').textContent = user.name || user.username;
  document.getElementById('user-initial').textContent = (user.name || user.username || '?').trim()[0].toUpperCase();

  try {
    const site = await api('/sites/' + SITE_PATH);
    siteId = site.id;
    driveId = await resolveDriveId();
    renderTable();
  } catch(e) {
    document.getElementById('tbl-body').innerHTML =
      `<tr><td colspan="4" style="color:#a4262c;padding:20px">사이트/라이브러리 연결 오류: ${e.message}<br><span style="font-size:.75rem;color:#605e5c">LIBRARY_NAME 설정값을 확인해주세요.</span></td></tr>`;
  }
}

// STK-NAS 사이트에서 "STK" 라이브러리(드라이브)를 찾아 driveId를 확정
async function resolveDriveId() {
  const drives = await api('/sites/' + siteId + '/drives');
  const hit = drives.value.find(d => d.name === LIBRARY_NAME) ||
              drives.value.find(d => (d.webUrl||'').replace(/\/$/,'').endsWith('/' + LIBRARY_NAME));
  if (hit) return hit.id;
  // 못 찾으면 기본 드라이브로 폴백 (경고만 남김)
  console.warn('LIBRARY_NAME("'+LIBRARY_NAME+'")과 일치하는 라이브러리를 못 찾아 기본 드라이브로 진행합니다. 드라이브 목록:', drives.value.map(d=>d.name));
  const def = await api('/sites/' + siteId + '/drive');
  return def.id;
}

// ══════════════════════════════════════════════════════════
// 테이블 렌더링
// ══════════════════════════════════════════════════════════
function switchCategory(cat) {
  currentCategory = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
  closeAllDropdowns();
}

function renderTable() {
  const tbody = document.getElementById('tbl-body');
  let html = '';
  DEPTS.forEach(d => {
    d.teams.forEach((team, idx) => {
      const first = idx === 0;
      html += `<tr class="${first?'dept-first':''}">`;
      if (first) html += `<td class="dept-cell" rowspan="${d.teams.length}">${esc(d.dept)}</td>`;
      html += `<td class="team-cell">${esc(team)}</td>`;
      html += `<td>${ddCell(d.dept, team, 'Policies & Procedures')}</td>`;
      html += `<td>${ddCell(d.dept, team, 'Templates')}</td>`;
      html += `</tr>`;
    });
  });
  tbody.innerHTML = html;
}

function ddCell(dept, team, sub) {
  const key = ddKey(dept, team, sub);
  return `<div class="dd" id="dd-${key}">
    <button class="dd-btn" onclick="toggleDropdown('${key}','${esc(dept)}','${esc(team)}','${esc(sub)}')">
      <span>${sub}</span><span class="arrow">▼</span>
    </button>
    <div class="dd-panel" id="panel-${key}"></div>
  </div>`;
}

function ddKey(dept, team, sub) {
  return btoa(unescape(encodeURIComponent(dept+'|'+team+'|'+sub))).replace(/[^a-zA-Z0-9]/g,'');
}

function esc(s) { return String(s).replace(/'/g,"\\'").replace(/"/g,'&quot;'); }

let openPanelId = null;

function closeAllDropdowns() {
  document.querySelectorAll('.dd-panel.open').forEach(p => p.classList.remove('open'));
  openPanelId = null;
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('.dd')) closeAllDropdowns();
});

async function toggleDropdown(key, dept, team, sub) {
  const panel = document.getElementById('panel-' + key);
  const isOpen = panel.classList.contains('open');
  closeAllDropdowns();
  if (isOpen) return; // 이미 열려있던 걸 다시 누른 거면 닫기만 하고 종료
  panel.classList.add('open');
  openPanelId = key;
  panel.innerHTML = `<div class="dd-loading">불러오는 중...</div>`;

  try {
    const files = await listFiles(dept, team, sub);
    if (!files.length) {
      panel.innerHTML = `<div class="dd-empty">등록된 문서가 없습니다.</div>`;
      return;
    }
    panel.innerHTML = files.map(f =>
      `<div class="dd-item" onclick="downloadFile(event,'${f.id}','${esc(f.name)}','${esc(dept)}','${esc(team)}','${esc(sub)}')">
        <span class="fico">📄</span><span>${esc(f.displayName)}</span>
      </div>`
    ).join('');
  } catch(e) {
    panel.innerHTML = `<div class="dd-error">불러오기 실패: ${esc(e.message)}</div>`;
  }
}

// ══════════════════════════════════════════════════════════
// 파일 목록 조회 (네이밍 규칙 필터링 + 번호순 정렬)
// ══════════════════════════════════════════════════════════
// SharePoint 업로드 과정에서 폴더명이 자동 변환되는 규칙을 그대로 반영
// (예: "Policies & Procedures" -> "Policies_and_Procedures", "F&C" -> "FnC", "CEO Office" -> "CEO_Office")
// 화면 표시 이름은 원래 그대로 쓰고, 실제 SharePoint 경로를 만들 때만 이 변환을 적용합니다.
function pathify(name) {
  return String(name)
    .replace(/ & /g, '_and_')   // 양쪽에 공백이 있는 & -> _and_
    .replace(/&/g, 'n')          // 공백 없이 붙어있는 & -> n
    .replace(/ /g, '_');         // 나머지 공백 -> _
}

async function listFiles(dept, team, sub) {
  const path = `${SPG_ROOT}/${pathify(dept)}/${pathify(team)}/${pathify(sub)}`;
  let items;
  try {
    const res = await api(`/drives/${driveId}/root:/${encPath(path)}:/children?$top=200`);
    items = res.value || [];
  } catch(e) {
    if (String(e.message).startsWith('404')) return []; // 폴더 자체가 아직 없으면 빈 목록으로 처리
    throw e;
  }
  return items
    .filter(it => it.file && NAME_RULE.test(it.name))   // 폴더 제외 + 네이밍 규칙 통과한 파일만
    .map(it => {
      const m = it.name.match(NAME_RULE);
      return { id: it.id, name: it.name, order: parseInt(m[1],10), displayName: it.name };
    })
    .sort((a,b) => a.order - b.order);
}

function encPath(path) {
  return path.split('/').map(encodeURIComponent).join('/');
}

// ══════════════════════════════════════════════════════════
// 다운로드 + 로깅
// ══════════════════════════════════════════════════════════
async function downloadFile(e, itemId, fileName, dept, team, sub) {
  e.stopPropagation();
  closeAllDropdowns();
  try {
    const meta = await api(`/drives/${driveId}/items/${itemId}`);
    const url = meta['@microsoft.graph.downloadUrl'];
    if (!url) throw new Error('다운로드 URL을 가져오지 못했습니다.');
    const a = document.createElement('a');
    a.href = url; a.download = fileName; document.body.appendChild(a); a.click(); a.remove();
    showToast('다운로드를 시작합니다: ' + fileName);
    logDownload(dept, team, sub, fileName).catch(err => console.warn('[로그 기록 실패]', err));
  } catch(err) {
    showToast('다운로드 오류: ' + err.message);
  }
}

async function logDownload(dept, team, sub, fileName) {
  const now = new Date();
  const dateStr = now.toISOString().slice(0,10); // YYYY-MM-DD
  const timeStr = now.toTimeString().slice(0,8);
  const who = (user.username || user.name || 'unknown');
  const logFolderPath = `${LOG_ROOT}/${dateStr}`;

  // 날짜 폴더가 없으면 생성 (폴더 생성은 PATCH가 아니라 상위 폴더에 POST로 폴더 아이템 생성)
  await ensureFolder(logFolderPath);

  const logFileName = `${dateStr}_${timeStr.replace(/:/g,'')}_${sanitize(who)}.json`;
  const content = JSON.stringify({
    date: dateStr, time: timeStr, user: who,
    department: dept, team: team, category: sub, file: fileName
  }, null, 2);

  const uploadPath = `${logFolderPath}/${logFileName}`;
  const t = await token();
  const res = await fetch(`${GRAPH}/drives/${driveId}/root:/${encPath(uploadPath)}:/content`, {
    method: 'PUT',
    headers: { Authorization: 'Bearer ' + t, 'Content-Type': 'application/json' },
    body: content
  });
  if (!res.ok) throw new Error('로그 업로드 실패: ' + res.status);
}

async function ensureFolder(path) {
  try {
    await api(`/drives/${driveId}/root:/${encPath(path)}`);
    return; // 이미 존재
  } catch(e) {
    // 없으면 생성 — 부모 경로부터 순서대로 생성
  }
  const parts = path.split('/');
  let cur = '';
  for (const part of parts) {
    const next = cur ? cur + '/' + part : part;
    try {
      await api(`/drives/${driveId}/root:/${encPath(next)}`);
    } catch(e) {
      const parentUrl = cur ? `/drives/${driveId}/root:/${encPath(cur)}:/children` : `/drives/${driveId}/root/children`;
      await api(parentUrl, 'POST', { name: part, folder: {}, '@microsoft.graph.conflictBehavior': 'replace' });
    }
    cur = next;
  }
}

function sanitize(s) { return String(s).replace(/[^a-zA-Z0-9._-]/g, '_'); }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => t.style.display = 'none', 3000);
}
</script>
</body>
</html>
